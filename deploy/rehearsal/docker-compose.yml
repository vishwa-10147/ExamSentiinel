# Production rehearsal: the AWS topology on one machine, with the production images and
# ENVIRONMENT=production. See deploy/rehearsal/README.md.
#
#   ALB (nginx: TLS, host routing, WebSockets) ─┬─ frontend (Next.js standalone)
#                                                └─ backend × 2 replicas (uvicorn, 2 workers each)
#   PostgreSQL (RDS) · Redis (ElastiCache) · Piston on the host (EC2 engine host)

name: examsentinel-rehearsal

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  SECRET_KEY: ${SECRET_KEY:?run setup.sh first}
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?run setup.sh first}@db:5432/examsentinel
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: https://exam.localhost:8443
  FRONTEND_URL: https://exam.localhost:8443
  PUBLIC_API_URL: https://api.exam.localhost:8443
  # Only the load balancer may say who the client is. On AWS: the ALB subnets' CIDRs. Here the
  # host's traffic arrives from the Docker gateway (172.30.0.1), so trusting the whole subnet
  # would let any client choose its address - trust the load balancer's own address only.
  FORWARDED_ALLOW_IPS: 172.30.0.10
  PISTON_URL: http://host.docker.internal:2000/api/v2/execute
  WEB_CONCURRENCY: "2"
  ADMIN_EMAIL: admin@sentinel.edu
  ADMIN_PASSWORD: ${REHEARSAL_PASSWORD:?run setup.sh first}

services:
  alb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8443:443"   # browsers: https://exam.localhost:8443, https://api.exam.localhost:8443
      - "127.0.0.1:8080:80"    # scripts: http://127.0.0.1:8080 (API only, no TLS)
    depends_on: [backend, frontend]
    networks:
      default:
        ipv4_address: 172.30.0.10

  backend:
    build:
      context: ../../backend
      args:
        WITH_AI: "false"
    image: examsentinel-backend:rehearsal
    environment: *backend-env
    deploy:
      replicas: 2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  migrate:
    image: examsentinel-backend:rehearsal
    command: ["migrate"]
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.exam.localhost:8443
        NEXT_PUBLIC_SITE_URL: https://exam.localhost:8443
    image: examsentinel-frontend:rehearsal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: examsentinel
    ports:
      - "127.0.0.1:55433:5432"  # host-only, for scripts/load_test.py
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
