# Stands in for the AWS Application Load Balancer: terminates TLS, routes by host name,
# upgrades WebSockets, appends X-Forwarded-For / X-Forwarded-Proto, and spreads requests over
# every backend replica (Docker DNS returns all of them; re-resolved every 10 s).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Same knobs as the ALB: idle timeout above the longest request (Submit waits up to 20 s,
# WebSockets stay open), and the client body limit above the largest upload.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
client_max_body_size 25m;

server {
    listen 443 ssl;
    server_name api.exam.localhost;
    ssl_certificate     /etc/nginx/certs/rehearsal.crt;
    ssl_certificate_key /etc/nginx/certs/rehearsal.key;

    location / {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl default_server;
    server_name exam.localhost;
    ssl_certificate     /etc/nginx/certs/rehearsal.crt;
    ssl_certificate_key /etc/nginx/certs/rehearsal.key;

    location / {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Plain HTTP to the API for scripts on this machine (an internal listener; on AWS scripts use
# the HTTPS endpoint).
server {
    listen 80;

    location / {
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
