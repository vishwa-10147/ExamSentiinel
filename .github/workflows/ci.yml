name: ExamSentinel CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/alembic/versions
      - run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Every light colour class has a dark-mode variant
        run: python3 frontend/scripts/add-dark-variants.py --check
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid  # production builds require it
  # Production schemas come only from migrations: they must apply cleanly to an empty
  # PostgreSQL database and produce exactly the schema the models describe.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: examsentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/examsentinel
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - name: Migrated schema matches the models
        run: python check_migrations.py
      - name: Latest migration downgrades and re-applies
        run: python -m alembic downgrade -1 && python -m alembic upgrade head

  # The images that production runs must build.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg WITH_AI=false -t examsentinel-backend:ci backend
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid -t examsentinel-frontend:ci frontend
