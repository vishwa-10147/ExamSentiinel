version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: examsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-examsentinel}
    ports:
    - 5440:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examsentinel}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - examsentinel-network
  redis:
    image: redis:7-alpine
    container_name: examsentinel-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - examsentinel-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsentinel-backend
    restart: unless-stopped
    environment:
    - ENVIRONMENT=${ENVIRONMENT:-development}
    - DEBUG=${DEBUG:-True}
    - SECRET_KEY=${SECRET_KEY:-examsentinel_super_secret_jwt_key_for_dev_change_in_production_987654321}
    - ALGORITHM=${ALGORITHM:-HS256}
    - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/examsentinel}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]}
    - CV_MODEL_PATH=${CV_MODEL_PATH:-/ai/models/yolo11n.pt}
    - PISTON_URL=${PISTON_URL:-http://piston:2000/api/v2/execute}
    ports:
    - ${BACKEND_PORT:-8000}:8000
    volumes:
    - ./backend:/app
    - ./scripts:/scripts:ro
    - ./ai:/ai:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - examsentinel-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examsentinel-frontend
    restart: unless-stopped
    environment:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
    - ${FRONTEND_PORT:-3000}:3000
    depends_on:
    - backend
    networks:
    - examsentinel-network
  # Code execution engine. User code runs only here, inside Piston's per-run
  # isolate sandbox (no network, non-root, CPU/memory/process/file limits). The
  # container is privileged so it can create those sandboxes; nothing mounts the
  # Docker socket. Install runtimes once: python scripts/install_piston_runtimes.py
  piston:
    build:
      context: ./infra/piston
    image: examsentinel-piston:latest
    container_name: examsentinel-piston
    restart: unless-stopped
    privileged: true
    environment:
    - PISTON_RUN_TIMEOUT=10000
    - PISTON_COMPILE_TIMEOUT=15000
    - PISTON_OUTPUT_MAX_SIZE=8388608
    - PISTON_MAX_PROCESS_COUNT=64
    - PISTON_RUN_MEMORY_LIMIT=268435456
    - PISTON_COMPILE_MEMORY_LIMIT=536870912
    ports:
    - 127.0.0.1:2000:2000
    volumes:
    - piston_packages:/piston/packages
    tmpfs:
    - /piston/jobs:exec,uid=1000,gid=1000,mode=711
    - /tmp:exec
    networks:
    - examsentinel-network
networks:
  examsentinel-network:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  piston_packages: null
