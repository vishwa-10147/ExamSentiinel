version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: examsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-examsentinel}
    ports:
    - 5433:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examsentinel}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - examsentinel-network
  redis:
    image: redis:7-alpine
    container_name: examsentinel-redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
    - examsentinel-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examsentinel-backend
    restart: unless-stopped
    environment:
    - ENVIRONMENT=${ENVIRONMENT:-development}
    - DEBUG=${DEBUG:-True}
    - SECRET_KEY=${SECRET_KEY:-examsentinel_super_secret_jwt_key_for_dev_change_in_production_987654321}
    - ALGORITHM=${ALGORITHM:-HS256}
    - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/examsentinel}
    - SYNC_DATABASE_URL=${SYNC_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/examsentinel}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]}
    - CV_MODEL_PATH=${CV_MODEL_PATH:-/ai/models/yolo11n.pt}
    ports:
    - ${BACKEND_PORT:-8000}:8000
    volumes:
    - ./backend:/app
    - ./scripts:/scripts:ro
    - ./ai:/ai:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - examsentinel-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examsentinel-frontend
    restart: unless-stopped
    environment:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
    - ${FRONTEND_PORT:-3000}:3000#
depends_on:
    - backend
    networks:
    - examsentinel-network
  sandbox-worker:
    build:
      context: ./execution-workers
      dockerfile: Dockerfile
    container_name: examsentinel-sandbox-worker
    restart: unless-stopped
    environment:
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - SANDBOX_REDIS_QUEUE=${SANDBOX_REDIS_QUEUE:-examsentinel:sandbox:queue}
    - SANDBOX_CPU_LIMIT=${SANDBOX_CPU_LIMIT:-1.0}
    - SANDBOX_MEMORY_LIMIT_MB=${SANDBOX_MEMORY_LIMIT_MB:-256}
    - SANDBOX_TIMEOUT_SEC=${SANDBOX_TIMEOUT_SEC:-5.0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - examsentinel-network
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
networks:
  examsentinel-network:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
