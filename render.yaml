services:
  - type: web
    name: examsentinel-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: examsentinel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: examsentinel-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: https://examsentinel-frontend.onrender.com
      - key: BACKEND_PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      # Single instance: apply migrations on boot (see backend/docker-entrypoint.sh).
      - key: RUN_MIGRATIONS_ON_START
        value: "true"

  - type: web
    name: examsentinel-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: examsentinel-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: 3000

  - type: keyvalue
    name: examsentinel-redis
    plan: free
    ipAllowList: []

databases:
  - name: examsentinel-db
    plan: free
    databaseName: examsentinel
    user: examsentinel_user
